<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Reset Failed</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f9;
}

.container{
    background:white;
    padding:40px;
    text-align:center;
    border-radius:12px;
    width:360px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    animation:fadeIn 0.7s ease;
}

.icon{
    font-size:80px;
    color:#e53935;
    margin-bottom:20px;
    animation:shake 0.5s;
}

h1{
    color:#c62828;
    margin-bottom:10px;
}

p{
    color:#666;
    font-size:15px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes shake{
    0%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    50%{transform:translateX(6px);}
    75%{transform:translateX(-6px);}
    100%{transform:translateX(0);}
}

</style>
</head>

<body>

<div class="container">

<div class="icon">❌</div>

<h1>Password Reset Failed</h1>

<p>Something went wrong while resetting your password.</p>

</div>

</body>
</html>
