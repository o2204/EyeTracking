<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 8px;
            padding: 40px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #4F46E5;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
        }
        .footer { margin-top: 30px; color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👁️ EyeTracking App</h2>
        <p>Hi <strong>{{ username }}</strong>,</p>
        <p>Thanks for registering! Please verify your email address to activate your account.</p>

        <a href="{{ verification_url }}" class="btn">
            ✅ Verify My Account
        </a>

        <p>Or copy this link:</p>
        <p style="word-break: break-all; color: #4F46E5;">
            {{ verification_url }}
        </p>

        <div class="footer">
            <p>If you didn't create an account, ignore this email.</p>
            <p>© 2024 EyeTracking App</p>
        </div>
    </div>
</body>
</html>
