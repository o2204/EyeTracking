<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .container{
            background:white;
            padding:40px;
            width:400px;
            border-radius:10px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .input-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-size:14px;
            color:#555;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:14px;
            transition:0.3s;
        }

        input:focus{
            border-color:#4CAF50;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            background:#4CAF50;
            border:none;
            color:white;
            font-size:16px;
            border-radius:6px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#43a047;
        }

        .footer{
            text-align:center;
            margin-top:15px;
            font-size:13px;
            color:#777;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <form method="POST" action="{{ reset-password }}">

    <div class="input-group">
    <label>New Password</label>
    <input type="password" name="password" placeholder="Enter a new password" required>
    </div>

    <div class="input-group">
    <label>Confirm Password</label>
    <input type="password" name="confirm_password" placeholder="Confirm your password" required>
    </div>

        <!-- token from email -->
        <input type="hidden" name="token" value="{{ token }}">

        <button type="submit">Reset Password</button>

    </form>

    <div class="footer">
        Secure password reset
    </div>

</div>

</body>
</html>
